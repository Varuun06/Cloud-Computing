services:
  - type: web
    name: mailroom-agent
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_API_KEY
        sync: false
